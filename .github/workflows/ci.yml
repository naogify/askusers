name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test (LLM / Embedding はすべてモック。API キー不要)
        run: pytest -q
      - name: Mock end-to-end smoke (4 files)
        run: |
          printf '# demo\nhello\n' > demo.md
          askusers demo.md --mock --count 5 --output out --format json > out.json
          python -c "import json; json.load(open('out.json'))"
          test -s out/survey.html -a -s out/report.md -a -s out/responses.csv -a -s out/data.json
